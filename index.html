        <div class="hud"><span class="js-st">Ваш ход</span></div>
        <div class="nim js-nim"></div>
        <p class="msg js-msg">Кто возьмёт последний камень — победил</p>
        <div class="row">
          <button class="btn js-new">Заново</button>
          <button class="btn js-change">Сложность</button>
        </div>
      </div>`;
    const nimEl = el.querySelector('.js-nim');
    const st = el.querySelector('.js-st');
    const msg = el.querySelector('.js-msg');
    let piles, playing, playerTurn;

    function reset() {
      piles = [...PILES];
      playing = true;
      playerTurn = true;
      st.textContent = 'Ваш ход';
      msg.textContent = 'Кто возьмёт последний камень — победил';
      render();
    }
    function render() {
      nimEl.innerHTML = '';
      piles.forEach((n, i) => {
        const p = document.createElement('div');
        p.className = 'pile';
        for (let k = 0; k < n; k++) {
          const s = document.createElement('div');
          s.className = 'stone';
          s.onclick = () => takeFrom(i, k + 1);
          p.appendChild(s);
        }
        nimEl.appendChild(p);
      });
    }
    function takeFrom(pileIndex, count) {
      if (!playing || !playerTurn) return;
      piles[pileIndex] -= count;
      render();
      if (checkGameOver()) return;
      playerTurn = false;
      st.textContent = 'Ход ИИ…';
      ctx.timeout(aiTurn, 500);
    }
    function aiTurn() {
      if (!playing) return;
      const xor = piles.reduce((a, b) => a ^ b, 0);
      let move = null;
      if (xor !== 0) {
        for (let i = 0; i < piles.length; i++) {
          const target = piles[i] ^ xor;
          if (target < piles[i]) { move = { i, take: piles[i] - target }; break; }
        }
      }
      if (!move) {
        let maxI = 0;
        for (let i = 1; i < piles.length; i++) if (piles[i] > piles[maxI]) maxI = i;
        if (piles[maxI] > 0) move = { i: maxI, take: 1 };
      }
      if (move) piles[move.i] -= move.take;
      render();
      if (checkGameOver()) return;
      playerTurn = true;
      st.textContent = 'Ваш ход';
    }
    function checkGameOver() {
      if (piles.every(p => p === 0)) {
        playing = false;
        msg.textContent = playerTurn ? 'Вы взяли последний — победа!' : 'ИИ взял последний — вы проиграли';
        st.textContent = 'Игра окончена';
        return true;
      }
      return false;
    }
    ctx.on(el.querySelector('.js-new'), 'click', reset);
    ctx.on(el.querySelector('.js-change'), 'click', () => { ctx.stop(); showPicker(); });
    reset();
  });
}

/* --- 18. Цвет --- */
function colorGame(el, ctx) {
  withDifficulty(el, ctx, {
    id: 'color', icon: '🎨', name: 'Цвет', subtitle: 'Размер сетки',
    diffs: [
      { id: 'small',  name: '3×3', desc: 'лёгкий старт' },
      { id: 'medium', name: '4×4', desc: 'средне' },
      { id: 'big',    name: '5×5', desc: 'сложно' },
    ]
  }, (diff, showPicker) => {
    const MIN_SIZE = diff.id === 'small' ? 3 : diff.id === 'medium' ? 4 : 5;
    el.innerHTML = `
      <div class="game">
        <div class="hud">
          <span>Уровень <b class="js-l">1</b></span>
          <span>Время <b class="js-t">0.0</b></span>
          <span style="font-size:11px">${diff.name}</span>
        </div>
        <div class="color js-grid"></div>
        <p class="msg js-msg">Найдите квадрат другого оттенка</p>
        <div class="row">
          <button class="btn js-new">Заново</button>
          <button class="btn js-change">Сложность</button>
        </div>
      </div>`;
    const grid = el.querySelector('.js-grid');
    const lEl = el.querySelector('.js-l');
    const tEl = el.querySelector('.js-t');
    const msg = el.querySelector('.js-msg');
    let level, roundStart;

    function reset() {
      ctx.clearTimers();
      level = 1;
      lEl.textContent = 1;
      msg.textContent = 'Найдите квадрат другого оттенка';
      roundStart = performance.now();
      setup();
      ctx.interval(() => {
        tEl.textContent = ((performance.now() - roundStart) / 1000).toFixed(1);
      }, 100);
    }
    function setup() {
      const size = Math.min(MIN_SIZE + Math.floor((level - 1) / 2), 8);
      const baseDiff = diff.id === 'small' ? 22 : diff.id === 'medium' ? 16 : 12;
      const curDiff = Math.max(3, baseDiff - level * 1.2);
      const baseH = Math.random() * 360;
      const baseS = 55 + Math.random() * 25;
      const baseL = 45 + Math.random() * 15;
      const count = size * size;
      const oddIndex = Math.floor(Math.random() * count);
      grid.innerHTML = '';
      grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${size}, 1fr)`;
      for (let i = 0; i < count; i++) {
        const d = document.createElement('div');
        d.className = 'c';
        const h = i === oddIndex ? (baseH + curDiff + 360) % 360 : baseH;
        d.style.background = `hsl(${h}, ${baseS}%, ${baseL}%)`;
        d.onclick = () => {
          if (i === oddIndex) {
            level++;
            lEl.textContent = level;
            roundStart = performance.now();
            setup();
          }
        };
        grid.appendChild(d);
      }
    }
    ctx.on(el.querySelector('.js-new'), 'click', reset);
    ctx.on(el.querySelector('.js-change'), 'click', () => { ctx.stop(); showPicker(); });
    reset();
  });
}

/* --- 19. Камень-ножницы-бумага --- */
function rpsGame(el, ctx) {
  el.innerHTML = `
    <div class="game">
      <div class="hud">
        <span>Вы <b class="js-p">0</b></span>
        <span>Ничьи <b class="js-d">0</b></span>
        <span>ИИ <b class="js-a">0</b></span>
      </div>
      <p class="big js-res">Выберите</p>
      <div class="row">
        <button class="btn js-o" data-k="rock">✊ Камень</button>
        <button class="btn js-o" data-k="paper">✋ Бумага</button>
        <button class="btn js-o" data-k="scissors">✌️ Ножницы</button>
      </div>
      <p class="hint js-detail"></p>
    </div>`;
  const res = el.querySelector('.js-res');
  const detail = el.querySelector('.js-detail');
  const pEl = el.querySelector('.js-p'), aEl = el.querySelector('.js-a'), dEl = el.querySelector('.js-d');
  const NAMES = { rock: 'Камень', paper: 'Бумага', scissors: 'Ножницы' };
  const ICONS = { rock: '✊', paper: '✋', scissors: '✌️' };
  let p = 0, a = 0, d = 0;
  el.querySelectorAll('.js-o').forEach(btn => {
    btn.onclick = () => {
      const you = btn.dataset.k;
      const keys = ['rock', 'paper', 'scissors'];
      const ai = keys[Math.floor(Math.random() * 3)];
      let out;
      if (you === ai) { d++; out = 'Ничья'; }
      else if ((you === 'rock' && ai === 'scissors') || (you === 'paper' && ai === 'rock') || (you === 'scissors' && ai === 'paper')) { p++; out = 'Вы победили!'; }
      else { a++; out = 'ИИ победил'; }
      pEl.textContent = p; aEl.textContent = a; dEl.textContent = d;
      res.textContent = out;
      detail.textContent = `Вы: ${ICONS[you]} ${NAMES[you]} · ИИ: ${ICONS[ai]} ${NAMES[ai]}`;
    };
  });
}

/* --- 20. Кроты --- */
function whackGame(el, ctx) {
  withDifficulty(el, ctx, {
    id: 'whack', icon: '🐹', name: 'Кроты', subtitle: 'Скорость появления',
    diffs: [
      { id: 'easy',   name: 'Легко',  desc: 'редко, долго сидят',  spawn: 1000, hold: 900 },
      { id: 'normal', name: 'Норма',  desc: 'классика',            spawn: 780,  hold: 620 },
      { id: 'hard',   name: 'Сложно', desc: 'часто, быстро прячутся', spawn: 550, hold: 420 },
    ]
  }, (diff, showPicker) => {
    el.innerHTML = `
      <div class="game">
        <div class="hud">
          <span>Счёт <b class="js-s">0</b></span>
          <span>Время <b class="js-t">30</b></span>
          <span style="font-size:11px">${diff.name}</span>
        </div>
        <div class="mole js-grid"></div>
        <p class="msg js-msg">Нажмите «Старт»</p>
        <div class="row">
          <button class="btn js-start">Старт</button>
          <button class="btn js-change">Сложность</button>
        </div>
      </div>`;
    const grid = el.querySelector('.js-grid');
    const sEl = el.querySelector('.js-s');
    const tEl = el.querySelector('.js-t');
    const msg = el.querySelector('.js-msg');
    const cells = [];
    for (let i = 0; i < 9; i++) {
      const c = document.createElement('div');
      c.className = 'c';
      c.onclick = () => {
        if (c.dataset.hit === '1') {
          score++;
          sEl.textContent = score;
          c.dataset.hit = '0';
          c.textContent = '';
          c.classList.remove('hit');
        }
      };
      cells.push(c);
      grid.appendChild(c);
    }
    let score = 0, time = 30, active = false;

    function resetGrid() {
      cells.forEach(c => { c.textContent = ''; c.dataset.hit = '0'; c.classList.remove('hit'); });
    }
    function start() {
      ctx.clearTimers();
      score = 0; time = 30; active = true;
      sEl.textContent = 0; tEl.textContent = 30;
      msg.textContent = 'Ловите кротов!';
      resetGrid();
      ctx.interval(() => {
        time--;
        tEl.textContent = time;
        if (time <= 0) end();
      }, 1000);
      ctx.interval(() => {
        if (!active) return;
        const free = cells.filter(c => c.dataset.hit !== '1');
        if (!free.length) return;
        const c = free[Math.floor(Math.random() * free.length)];
        c.textContent = '🐹';
        c.dataset.hit = '1';
        c.classList.add('hit');
        ctx.timeout(() => {
          if (c.dataset.hit === '1') {
            c.dataset.hit = '0';
            c.textContent = '';
            c.classList.remove('hit');
          }
        }, diff.hold);
      }, diff.spawn);
    }
    function end() {
      active = false;
      ctx.clearTimers();
      resetGrid();
      msg.textContent = 'Время вышло! Счёт: ' + score;
    }
    ctx.on(el.querySelector('.js-start'), 'click', start);
    ctx.on(el.querySelector('.js-change'), 'click', () => { ctx.stop(); showPicker(); });
  });
}

  { id: 'simon',      icon: '🎵', name: 'Саймон',           desc: 'Повторите мелодию',     mount: simonGame },

  { id: 'rps',        icon: '✊', name: 'Камень-ножницы',   desc: 'Против ИИ',             mount: rpsGame },
  { id: 'whack',      icon: '🐹', name: 'Кроты',            desc: '30 секунд на охоту',    mount: whackGame },
];

let activeCtx = null;

function goHome() {
  if (activeCtx) { activeCtx.stop(); activeCtx = null; }
  backBtn.hidden = true;
  h1.textContent = 'Мини-игры';
  document.title = 'Мини-игры';
  // Убираем оверлеи, если остались
  document.querySelectorAll('.overlay').forEach(o => o.remove());
  renderHome();
}

function renderHome() {
  app.innerHTML = '<div class="grid"></div>';
  const grid = app.querySelector('.grid');
  GAMES.forEach(g => {
    const b = document.createElement('button');
    b.className = 'card';
    b.innerHTML = `<div class="ico">${g.icon}</div><div class="nm">${g.name}</div><div class="ds">${g.desc}</div>`;
    b.onclick = () => openGame(g.id);
    grid.appendChild(b);
  });
}

function openGame(id) {
  const game = GAMES.find(g => g.id === id);
  if (!game) return;
  if (activeCtx) activeCtx.stop();
  document.querySelectorAll('.overlay').forEach(o => o.remove());
  const c = makeCtx();
  activeCtx = c;
  backBtn.hidden = false;
  h1.textContent = game.name;
  document.title = game.name + ' · Мини-игры';
  app.innerHTML = `<div class="gtitle">${game.icon} ${game.name}</div><div class="stage"></div>`;
  try {
    game.mount(app.querySelector('.stage'), c);
  } catch (e) {
    console.error(e);
    app.querySelector('.stage').innerHTML = '<p class="hint">Ошибка запуска игры</p>';
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

backBtn.onclick = goHome;

/* ============ ТЕМА ============ */
function applyTheme(t) {
  html.dataset.theme = t;
  localStorage.setItem('mini.theme', t);
  themeBtn.textContent = t === 'dark' ? '☀' : '☾';
}
themeBtn.onclick = () => {
  applyTheme(html.dataset.theme === 'dark' ? 'light' : 'dark');
};
applyTheme(
  localStorage.getItem('mini.theme') ||
  (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
);

/* ============ СТАРТ ============ */
renderHome();
</script>
